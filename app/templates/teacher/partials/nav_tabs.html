<nav class="chrome-tabstrip" role="tablist" aria-label="Teacher sections">
    <a href="/teacher/lesson-planning"
       class="chrome-tab {% if active_page == 'lesson-planning' %}active{% endif %}"
       role="tab" aria-selected="{{ 'true' if active_page == 'lesson-planning' else 'false' }}">
        <span class="chrome-tab-label">Lesson Planning</span>
    </a>
    <a href="/teacher/school-days"
       class="chrome-tab {% if active_page == 'school-days' %}active{% endif %}"
       role="tab" aria-selected="{{ 'true' if active_page == 'school-days' else 'false' }}">
        <span class="chrome-tab-label">School Year Planning</span>
    </a>
    <a href="/teacher/student-responses"
       class="chrome-tab {% if active_page == 'student-responses' %}active{% endif %}{% if unread_student_message_count %} has-unread-badge{% endif %}"
       role="tab" aria-selected="{{ 'true' if active_page == 'student-responses' else 'false' }}">
        <span class="chrome-tab-label">Student Responses</span>{% if unread_student_message_count %}<span class="chrome-tab-badge"
              style="display:inline-flex;align-items:center;justify-content:center;min-width:1.35rem;height:1.35rem;margin:0 0 0 0.15rem;padding:0 0.35rem;border-radius:999px;background-color:#2563eb;color:#ffffff;font-size:0.7rem;font-weight:700;line-height:1;border:2px solid #ffffff;"
              title="{{ unread_student_message_count }} unread"
              aria-label="{{ unread_student_message_count }} unread student messages">{{ unread_student_message_count }}</span>{% endif %}
    </a>
</nav>
