<header class="app-header">
    <div class="header-inner">
        <div class="header-left">
            <a href="{{ home_url }}" class="logo">
                <span class="logo-icon">📚</span>
                <span class="logo-text">{{ app_name }}</span>
            </a>
            {% if page_title %}
            <div class="header-page-info">
                <span class="header-page-title">{{ page_title }}</span>
                {% if page_subtitle %}
                <span class="header-page-separator" aria-hidden="true">—</span>
                <span class="header-page-subtitle">{{ page_subtitle }}</span>
                {% endif %}
            </div>
            {% endif %}
        </div>
        <div class="header-right">
            <div class="user-pill">
                <span class="user-avatar">{{ user.first_name[0] }}{{ user.last_name[0] }}</span>
                <div>
                    <strong>{{ user.full_name }}</strong>
                    <span class="role-badge {{ user.role.value }}">{{ user.role.value | title }}</span>
                </div>
            </div>
            <a href="/logout" class="btn btn-ghost btn-sm">Sign Out</a>
        </div>
    </div>
</header>
