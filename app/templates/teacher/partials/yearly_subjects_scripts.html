<script>
const weekdayLabels = {{ weekday_labels | tojson }};

function syncWeekdayHidden(row) {
    const checked = [...row.querySelectorAll('.weekday-cb:checked')].map(cb => cb.value);
    const hidden = row.querySelector('input[name="weekdays_list"]');
    if (hidden) hidden.value = checked.join(',');
}

function bindScheduleRow(row) {
    row.querySelectorAll('.weekday-cb').forEach(cb => {
        cb.addEventListener('change', () => syncWeekdayHidden(row));
    });
    row.querySelector('.btn-remove')?.addEventListener('click', () => row.remove());
}

document.querySelectorAll('[data-schedule-row]').forEach(row => {
    syncWeekdayHidden(row);
    bindScheduleRow(row);
});

document.getElementById('yearly-subjects-form')?.addEventListener('submit', () => {
    document.querySelectorAll('[data-schedule-row]').forEach(syncWeekdayHidden);
});

document.getElementById('add-schedule-item')?.addEventListener('click', () => {
    const list = document.getElementById('schedule-items-list');
    const row = document.createElement('tr');
    row.className = 'yearly-subject-row';
    row.setAttribute('data-schedule-row', '');
    row.innerHTML = `
        <td>
            <input type="hidden" name="weekdays_list" value="">
            <input type="text" name="item_names" placeholder="Name" required>
        </td>
        <td>
            <select name="item_kinds">
                <option value="special_activity">Special Activity</option>
                <option value="subject">Subject</option>
            </select>
        </td>
        <td>
            <select name="special_types">
                <option value="">—</option>
                <option value="co_op">Co-Op</option>
                <option value="wild_and_free">Wild &amp; Free</option>
                <option value="classical_conversations">CC</option>
                <option value="other">Other</option>
            </select>
        </td>
        ${weekdayLabels.map((label, i) => `
            <td class="weekday-col">
                <label class="weekday-check weekday-check-table">
                    <input type="checkbox" class="weekday-cb" value="${i}">
                    <span class="sr-only">${label}</span>
                </label>
            </td>
        `).join('')}
        <td>
            <input type="number" name="lesson_amounts" min="0" value="0" placeholder="0" class="lesson-amount-input">
        </td>
        <td>
            <input type="text" name="item_descriptions" placeholder="Description">
        </td>
        <td>
            <input type="url" name="external_links" placeholder="URL">
        </td>
        <td class="yearly-subject-actions">
            <button type="button" class="btn-remove" aria-label="Remove subject or activity">&times;</button>
        </td>
    `;
    list.appendChild(row);
    bindScheduleRow(row);
});
</script>
