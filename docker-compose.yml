services:
  db:
    image: postgres:16-alpine
    container_name: hst-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hst_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-home_school_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hst_user} -d ${POSTGRES_DB:-home_school_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hst-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hst_user}:${POSTGRES_PASSWORD:-change_me_secure_password}@db:5432/${POSTGRES_DB:-home_school_tracker}
      SECRET_KEY: ${SECRET_KEY:-change_me_to_a_long_random_secret_key}
      MEDIA_ROOT: /app/media
    volumes:
      # Drop MP3s/PDFs/other lesson files into ./media on the host
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
