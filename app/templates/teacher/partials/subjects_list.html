<section class="panel subjects-view">
    <div class="subjects-view-toolbar">
        <a href="/teacher/school-days?cal_month={{ cal_month_param }}"
           class="btn btn-secondary btn-sm">
            ← Back to School Year Planning
        </a>
    </div>

    <h2>Yearly Subjects &amp; Activities</h2>
    <p class="section-hint">Choose a subject or activity to view and edit its schedule for the school year.</p>

    {% if yearly_subjects %}
    <div class="subjects-button-table-wrap">
        <table class="subjects-button-table" aria-label="Yearly subjects and activities">
            <tbody>
                {% for item in yearly_subjects %}
                <tr>
                    <td class="subjects-button-cell">
                        <form method="get" action="/teacher/school-days" class="subject-list-form">
                            <input type="hidden" name="cal_month" value="{{ cal_month_param }}">
                            <input type="hidden" name="subjects_view" value="detail">
                            <input type="hidden" name="subject_id" value="{{ item.id }}">
                            <button type="submit" class="btn btn-secondary subject-list-btn">
                                {{ item.name }}
                            </button>
                        </form>
                    </td>
                    <td class="subjects-remove-cell">
                        <form method="post" action="/teacher/school-days/subjects/delete" class="subject-list-form">
                            <input type="hidden" name="cal_month" value="{{ cal_month_param }}">
                            <input type="hidden" name="subject_id" value="{{ item.id }}">
                            <button type="submit"
                                    class="btn btn-secondary btn-sm btn-danger subject-remove-btn"
                                    onclick="return confirm('Remove {{ item.name }}?');"
                                    aria-label="Remove {{ item.name }}">
                                Remove
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p class="empty-state">No subjects or activities yet. Add one to get started.</p>
    {% endif %}

    <div class="subjects-list-footer">
        <form method="get" action="/teacher/school-days" class="subject-list-form">
            <input type="hidden" name="cal_month" value="{{ cal_month_param }}">
            <input type="hidden" name="subjects_view" value="detail">
            <input type="hidden" name="subject_id" value="new">
            <button type="submit" class="btn btn-primary subject-list-btn">
                + Add Subject or Activity
            </button>
        </form>
    </div>
</section>
